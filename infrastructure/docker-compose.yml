version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    container_name: bhagwanti-traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - bhagwanti-network

  db:
    image: postgres:16-alpine
    container_name: bhagwanti-db
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - bhagwanti-network

  redis:
    image: redis:7-alpine
    container_name: bhagwanti-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - bhagwanti-network

  api:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.api

    container_name: bhagwanti-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api.rule=Host(`api.anshumanmaurya.in`)"

      - "traefik.http.routers.api.entrypoints=web"

      - "traefik.http.services.api.loadbalancer.server.port=8000"

    networks:
      - bhagwanti-network

  web:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.web

    container_name: bhagwanti-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}

    depends_on:
      api:
        condition: service_healthy

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.web.rule=Host(`cloud.anshumanmaurya.in`)"

      - "traefik.http.routers.web.entrypoints=web"

      - "traefik.http.services.web.loadbalancer.server.port=3000"

    networks:
      - bhagwanti-network

volumes:
  postgres_data:
  redis_data:

networks:
  bhagwanti-network:
    driver: bridge
